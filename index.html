<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>Чаты</h1>
        <div class="head-actions">
          <button class="round dark" title="Код приглашения">🔑</button>
          <button class="round blue" id="newChat" title="Новый чат">+</button>
        </div>
      </div>

      <div class="search">
        <span>🔍</span>
        <input id="searchInput" placeholder="Поиск по чатам">
      </div>

      <div id="chatList" class="chat-list">
        <div class="empty">
          <div>Чатов пока нет.</div>
          <div>Создайте свой или вступите по коду.</div>
        </div>
      </div>

      <nav class="bottom-nav">
        <button class="nav-item active"><span>▱</span><small>Чаты</small></button>
        <button class="nav-item"><span>♙</span><small>Контакты</small></button>
        <button class="nav-item"><span>☷</span><small>Настройки</small></button>
        <button class="nav-item"><span>😊</span><small>Профиль</small></button>
      </nav>
    </aside>

    <main class="main">
      <div class="pattern"></div>
      <section id="welcome" class="welcome">Выберите чат слева</section>

      <section id="chatView" class="chat-view hidden">
        <header class="chat-header">
          <button id="backBtn" class="mobile-back">‹</button>
          <div class="avatar" id="chatAvatar">A</div>
          <div>
            <strong id="chatName">Чат</strong>
            <div class="status">в сети</div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="composer">
          <input id="messageInput" autocomplete="off" placeholder="Написать сообщение...">
          <button type="submit">➤</button>
        </form>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>Новый чат</h2>
      <input id="chatNameInput" placeholder="Имя собеседника">
      <div class="modal-actions">
        <button id="cancelModal">Отмена</button>
        <button id="createChat">Создать</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
